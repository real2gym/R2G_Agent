[metadata]
name = real2gym-agent
version = 0.1.0
description = Real2Gym C0 continuous stage-code agent for MuJoCo simulation
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/real2gym/R2G_Agent

[options]
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
include = roboagent*

[options.package_data]
roboagent = resources/*.txt, resources/*.json, resources/*.html

[options.extras_require]
sim =
    numpy>=1.24
    scipy>=1.10
    mujoco>=3.2,<4
    Pillow>=10
    imageio>=2.31
    imageio-ffmpeg>=0.4
test =
    numpy>=1.24
    Pillow>=10

[options.entry_points]
console_scripts =
    roboagent = roboagent.cli:main
