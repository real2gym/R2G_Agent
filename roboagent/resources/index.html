<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoboAgent episode</title><style>body{background:#10151c;color:#e8edf4;font:16px/1.6 system-ui;max-width:1200px;margin:24px auto;padding:20px}section{background:#1b2430;padding:20px;border-radius:10px;margin:16px 0}.views{display:grid;grid-template-columns:1fr 1fr;gap:12px}video,img{width:100%;border-radius:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}button{padding:8px 12px;margin:4px;font:inherit}a{color:#abc6ef}@media(max-width:650px){.views{grid-template-columns:1fr}}</style></head><body><h1>RoboAgent 执行记录</h1><p id="status">等待记录</p><section><h2>完整视频／当前观察</h2><div class="views" id="views"></div></section><section><h2>逐轮代码与反馈</h2><div id="buttons"></div><div id="round"></div></section><section><h2>独立结果</h2><pre id="outcome"></pre><a href="run.json">完整记录</a></section><script>
let data,selected=null;const el=id=>document.getElementById(id);function drawRound(){const r=data.rounds[selected===null?data.rounds.length-1:selected];el('round').replaceChildren();if(!r)return;const images=document.createElement('div');images.className='views';for(const view of ['agentview','wrist']){const im=document.createElement('img');im.alt=view;im.src=`episode/${r.image_dir}/${view}.png`;images.append(im)}el('round').append(images);const p=document.createElement('pre');p.textContent=JSON.stringify({round:r.round,executed:r.executed,decision:r.decision,feedback:r.feedback},null,2);el('round').append(p)}async function poll(){try{data=await(await fetch('run.json?t='+Date.now())).json();el('status').textContent=`${data.status} · ${data.task.language} · ${data.rounds.length} responses · ${data.steps} control steps`;if(!el('views').querySelector('video')){el('views').replaceChildren();if(data.latest)for(const view of ['agentview','wrist']){const v=document.createElement(data.videos?'video':'img');v.src=data.videos?`episode/${view}.mp4`:`episode/${data.latest}/${view}.png`;v.title=view;if(data.videos){v.controls=true;v.preload='metadata'}el('views').append(v)}}el('buttons').replaceChildren();for(const [i,r] of data.rounds.entries()){const b=document.createElement('button');b.textContent=r.round;b.onclick=()=>{selected=i;drawRound()};el('buttons').append(b)}drawRound();el('outcome').textContent=JSON.stringify({native:data.native,stop_reason:data.stop_reason,finalization_error:data.finalization_error},null,2)}catch(e){el('status').textContent=String(e)}}poll();setInterval(poll,4000);
</script></body></html>
